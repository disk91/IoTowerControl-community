# Contacts Service configuration.
# This service is responsible to manage the third party contacts
# This module is part of the non community edition.

# -----------------------------------------
# Intracom Service configuration.
# Defines how the service will broadcast messages to all the distributed instances of itself
# Medium can be memory, db or mqtt, currently only memory is implemented
contacts.integration.medium=${CONTACTS_INTEGRATION_MEDIUM:memory}
contacts.integration.timeout.ms=${CONTACTS_INTEGRATION_TMOUT:10000}
